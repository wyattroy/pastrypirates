<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- THE TAPPABLE COPY — the one Wyatt actually opens, on his phone:
       https://claude.ai/code/artifact/afdf3cd2-506f-44f7-ade1-5b1b6cec68cc
     A REPO PATH IS NOT A DELIVERY. On a phone this file resolves to GitHub source view --
     doctype and a wall of CSS -- which is what he was handed on 2026-08-30 and photographed.
     Publish the artifact, give him the link; THIS file is the durable copy. -->
</head>
<body>
<title>Staging Checklist 08-30</title>
<style>
  /* Palette inherited from .planning/staging-checklist.html — these sheets already have a look,
     and consistency across them is a core project value. Only the delivery changed. */
  :root{
    --ink:#12303a; --muted:#5b7580; --line:#d8e3e7; --card:#fffdf7; --bg:#eef4f6;
    --pass:#1f9d6b; --fail:#d1495b; --hold:#b8860b; --accent:#0f7f96;
    --shadow:0 1px 2px rgba(16,48,58,.08), 0 6px 18px rgba(16,48,58,.05);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --ink:#e8f1f4; --muted:#93aab3; --line:#22414c; --card:#12262e; --bg:#0b1a20;
    --pass:#3ec38c; --fail:#ff7085; --hold:#e0b13c; --accent:#4fc3dd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }}
  :root[data-theme=dark]{
    --ink:#e8f1f4; --muted:#93aab3; --line:#22414c; --card:#12262e; --bg:#0b1a20;
    --pass:#3ec38c; --fail:#ff7085; --hold:#e0b13c; --accent:#4fc3dd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:0 0 132px; -webkit-text-size-adjust:100%}
  .wrap{max-width:600px;margin:0 auto;padding:0 16px}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-ligatures:none}

  /* The stamp is the one thing he must match character by character, so it stays on screen. */
  header{position:sticky;top:0;z-index:10;background:var(--card);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  header .wrap{padding-top:13px;padding-bottom:13px}
  h1{margin:0 0 3px;font-size:19px;letter-spacing:.2px;text-wrap:balance}
  .stampline{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
  .stamp{font-size:13px;padding:2px 7px;border-radius:6px;background:var(--bg);
    border:1px solid var(--line);color:var(--ink);white-space:nowrap}
  .bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .count{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;color:var(--muted)}
  a{color:var(--accent)}

  h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
    margin:30px 0 11px;font-weight:700;text-wrap:balance}
  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:13px 15px;margin:0 0 12px;font-size:14.5px;box-shadow:var(--shadow)}

  .item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;
    margin:0 0 12px;box-shadow:var(--shadow);border-left:4px solid transparent}
  .item.pass{border-left-color:var(--pass)}
  .item.fail{border-left-color:var(--fail)}
  .item.hold{border-left-color:var(--hold)}
  .top{display:flex;gap:11px;align-items:flex-start}
  .n{flex:0 0 auto;min-width:27px;height:27px;padding:0 7px;border-radius:7px;background:var(--bg);
    border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .look{font-weight:650;font-size:15.5px}
  dl{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 11px;font-size:14.5px}
  dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;
    font-weight:700;padding-top:4px}
  dd{margin:0}

  /* Tap targets sized for a thumb, not a mouse. */
  .btns{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
  button{font:inherit;font-size:14px;padding:10px 15px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;
    min-height:44px;touch-action:manipulation}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btns button[aria-pressed=true]{color:#fff;border-color:transparent;font-weight:650}
  .b-pass[aria-pressed=true]{background:var(--pass)}
  .b-fail[aria-pressed=true]{background:var(--fail)}
  .b-hold[aria-pressed=true]{background:var(--hold)}
  textarea{width:100%;margin-top:10px;padding:11px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;
    font-size:15px;min-height:52px;resize:vertical}
  textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);padding:11px 0 max(11px,env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(16,48,58,.07)}
  footer .wrap{display:flex;gap:9px;align-items:center}
  footer button{flex:1}
  .primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:650}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <h1>Staging checklist — 30 Aug</h1>
    <div class="stampline">
      <span>Open</span>
      <a href="https://staging.playpastrypirates.com/">staging.playpastrypirates.com</a>
      <span>and check the ☰ stamp reads</span>
      <span class="stamp mono">2026.08.30.1-staging@2cac247d</span>
    </div>
    <div class="bar">
      <span class="count" id="count">0 answered</span>
      <span class="count">· saves as you type</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer><div class="wrap">
  <button class="primary" id="copy">Copy my notes</button>
  <button id="clear">Clear all</button>
</div></footer>

<script>
const DATA = [
 {h:"Read this first — who wrote this sheet, and what it does not cover"},
 {note:"<strong>This sheet was written by the sea-trial session, and that session did NOT publish this build.</strong> Staging already carried <code>2026.08.30.1-staging@2cac247d</code> when this was written, published by the session called <em>Cloud: Edits</em>, which is still working. I read the stamp off the live site to be sure. I have changed <strong>no game code at all</strong> — every game change on my branch arrived by merging that session's work so I could build the trial on top of it."},
 {note:"<strong>Why I did not publish, since a hook asked me to.</strong> Publishing my branch would have overwritten the build ye are meant to open in the morning, with a newer game change (<code>2026.08.30.2</code>, a narration-bubble tail fix) that <strong>has not been through a sea trial on my branch</strong>. Two rulings on the record say don't: <em>CLOUD-VS-LOCAL.md</em> — “the single most expensive thing found on 2026-08-28 was two environments running at once and overwriting each other” — and that session's own ledger: “pushing an unsailed build to gain that would be trading the one rule that has caught me all night.” <strong>So staging stays where it is, and this sheet describes what staging actually serves.</strong>"},
 {n:1,look:"Open staging, ☰ menu, read the stamp.",right:"It ends “-staging@2cac247d”, and the browser tab reads [STAGING].",why:"There is no build step — a different stamp is a different build, never a cache. If it ends @907c5a09, or the version reads 2026.08.30.2, the other session published while ye slept and this sheet describes the wrong build. Tell me and I will rewrite it."},

 {h:"What is new in this build — the other session's work, their measurements"},
 {n:2,look:"Crew game, two devices. Read the narration line as each captain acts, on BOTH screens.",right:"Each line is clearly about the right captain, and both screens agree about who it is about.",why:"Q-18: the subject and the serial are one fact, so both seats decide who a line is about with ONE shared rule instead of two. Their measurement, not mine — the wire half had NEVER worked in a crew game: 0 of 47 narration lines carried a subject before, 4 of 80 carry one now, and none carries half of one."},
 {n:3,look:"Same crew game — watch a purse (a captain's coins) as a trade or a battle resolves.",right:"The number lands once and stays. A brief beat of stillness before it moves is the intended behaviour, not a stall.",why:"YER DECISION, not a defect. To stop the numbers flickering, the guest now waits up to 450ms for the event its line names. That session flagged it as new behaviour ye did not sanction and put it to ye directly: “a beat of stillness” against “numbers that flicker”, and the flicker is what ye have complained about for weeks. Their words: “it is his call and I am naming it.” Tell them which ye prefer."},
 {n:4,look:"A sail prompt on a phone-sized crew guest. Look at the narration bubble over the board.",right:"Same as it was two days ago — no wider, no different.",why:"A bubble-widening change went in and was REVERTED before this build. Their reason is worth yer trust: it was built on a premise they later verified false, it showed no improvement anywhere, and the fleet number it was meant to help got WORSE (no-cover-ask 10 → 12). Nothing to test here — this row exists so ye are not hunting for a change that was withdrawn."},

 {h:"Already known — please do not spend yer eyes"},
 {note:"<strong>1. Sail squares a guest cannot tap (W1-4)</strong> — diagnosed, not fixed. It is three faults, not one, and the biggest is not the recorded one: <strong>the narration bubble sits on top of the squares it is asking ye about</strong> (10 of the coverings name the bubble), a square drawn past the right edge, and the captains panel a distant third. Two geometry theories are already measured dead.<br><br><strong>2.</strong> W3-1 diagnosed but not fixed; W3-3 and W3-5 untouched.<br><br><strong>3.</strong> The captains panel row order differs between host and guest — <strong>that is yer own rule</strong> (2026-08-20: the viewer's captain on top, then sailing order). Not a bug.<br><br><strong>4.</strong> WebKit legs crash mid-voyage in a cloud container — a real Linux-WebKit segfault, diagnosed by core dump. Safari on yer real phone shares none of it.<br><br><strong>5.</strong> The trial's crew screenshots are numbered per seat, so host and guest images are DIFFERENT MOMENTS — the trial cannot yet show a host/guest divergence in pictures. That is what I am rebuilding."},
 {note:"<strong>And one about the instrument, because it changes how ye should read a report.</strong> The vision judge is not deterministic on borderline screens: the same five screenshots came back FAIL in one run and PASS in another, minutes apart, same model and rubric. A blatant planted fault was caught every single time. So a lone borderline FAIL in a trial report is a thing to look at, not yet a finding — and a FAIL that vanishes on a re-run is not proof anything was fixed. Rate unmeasured; I am not designing around it."}
];

const KEY = "pp-staging-2026-08-30-2cac247d";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

for (const row of DATA) {
  if (row.h) { const h = document.createElement("h2"); h.textContent = row.h; app.appendChild(h); continue; }
  if (row.note) { const d = document.createElement("div"); d.className = "note"; d.innerHTML = row.note; app.appendChild(d); continue; }

  const st = state[row.n] || {};
  const el = document.createElement("section");
  el.className = "item" + (st.v ? " " + st.v : "");
  el.innerHTML =
    '<div class="top"><span class="n">' + row.n + '</span><span class="look">' + esc(row.look) + '</span></div>' +
    '<dl><dt>Right</dt><dd>' + esc(row.right) + '</dd>' +
        '<dt>Why</dt><dd>' + row.why + '</dd></dl>' +
    '<div class="btns">' +
      '<button class="b-pass" aria-pressed="' + (st.v === "pass") + '">Looks right</button>' +
      '<button class="b-fail" aria-pressed="' + (st.v === "fail") + '">Wrong</button>' +
      '<button class="b-hold" aria-pressed="' + (st.v === "hold") + '">Could not tell</button>' +
    '</div>' +
    '<textarea placeholder="What ye saw (optional)"></textarea>';

  const [bp, bf, bh] = el.querySelectorAll(".btns button");
  const ta = el.querySelector("textarea");
  ta.value = st.note || "";
  ta.addEventListener("input", () => { (state[row.n] = state[row.n] || {}).note = ta.value; save(); });

  const setV = v => {
    const cur = state[row.n] || (state[row.n] = {});
    cur.v = (cur.v === v) ? null : v;
    el.className = "item" + (cur.v ? " " + cur.v : "");
    bp.setAttribute("aria-pressed", cur.v === "pass");
    bf.setAttribute("aria-pressed", cur.v === "fail");
    bh.setAttribute("aria-pressed", cur.v === "hold");
    save(); tally();
  };
  bp.onclick = () => setV("pass"); bf.onclick = () => setV("fail"); bh.onclick = () => setV("hold");
  app.appendChild(el);
}

const items = DATA.filter(r => r.n);
function tally() {
  const done = items.filter(r => (state[r.n] || {}).v).length;
  const bad = items.filter(r => (state[r.n] || {}).v === "fail").length;
  document.getElementById("count").textContent =
    done + " of " + items.length + " answered" + (bad ? " · " + bad + " wrong" : "");
}
tally();

document.getElementById("copy").onclick = async () => {
  const lines = ["Staging checklist — build 2026.08.30.1-staging@2cac247d", ""];
  for (const r of items) {
    const s = state[r.n] || {};
    const v = s.v === "pass" ? "LOOKS RIGHT" : s.v === "fail" ? "WRONG" : s.v === "hold" ? "COULD NOT TELL" : "—";
    lines.push(r.n + ". [" + v + "] " + r.look + (s.note ? "\n   " + s.note : ""));
  }
  const text = lines.join("\n");
  const btn = document.getElementById("copy");
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied — paste it to me"; }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); try { document.execCommand("copy"); btn.textContent = "Copied — paste it to me"; }
    catch (e2) { btn.textContent = "Select and copy above"; } t.remove(); }
  setTimeout(() => { btn.textContent = "Copy my notes"; }, 2600);
};

document.getElementById("clear").onclick = () => {
  state = {}; save();
  document.querySelectorAll(".item").forEach(el => { el.className = "item";
    el.querySelectorAll(".btns button").forEach(b => b.setAttribute("aria-pressed", "false"));
    el.querySelector("textarea").value = ""; });
  tally();
};
</script>
</body>
</html>
