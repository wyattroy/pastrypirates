<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pastry Pirates — playtest checklist</title>
<style>
:root{
  --ink:#12303a; --muted:#5b7580; --line:#d8e3e7; --card:#fffdf7; --bg:#eef4f6;
  --pass:#1f9d6b; --fail:#d1495b; --accent:#0f7f96; --shadow:0 1px 2px rgba(16,48,58,.08),0 6px 18px rgba(16,48,58,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#e8f1f4; --muted:#93aab3; --line:#22414c; --card:#12262e; --bg:#0b1a20;
  --pass:#3ec38c; --fail:#ff7085; --accent:#4fc3dd; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  padding:0 0 120px}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:14px 18px;box-shadow:var(--shadow)}
.wrap{max-width:920px;margin:0 auto}
h1{margin:0 0 2px;font-size:19px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13.5px}
.sub a{color:var(--accent)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
button{font:inherit;font-size:13.5px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
button:active{transform:translateY(1px)}
section{max-width:920px;margin:22px auto 0;padding:0 18px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
  margin:26px 0 10px;font-weight:700}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:14.5px;box-shadow:var(--shadow)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
  margin:0 0 12px;box-shadow:var(--shadow)}
.item.pass{border-left:4px solid var(--pass)}
.item.fail{border-left:4px solid var(--fail)}
.top{display:flex;gap:11px;align-items:flex-start}
.n{flex:0 0 auto;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:var(--bg);
  color:var(--muted);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.txt{flex:1 1 auto;min-width:0}
.look{font-weight:650}
.right{color:var(--muted);font-size:14.5px;margin-top:3px}
.why{color:var(--muted);font-size:13px;margin-top:5px;font-style:italic;opacity:.85}
.acts{display:flex;gap:7px;margin:11px 0 0;flex-wrap:wrap}
.acts button{min-width:74px}
.acts button[aria-pressed=true][data-v=pass]{background:var(--pass);color:#fff;border-color:transparent;font-weight:650}
.acts button[aria-pressed=true][data-v=fail]{background:var(--fail);color:#fff;border-color:transparent;font-weight:650}
textarea{width:100%;margin-top:9px;min-height:0;height:38px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;height:84px}
textarea.has{height:84px;background:var(--card)}
.saved{color:var(--muted);font-size:12.5px}
dialog{border:none;border-radius:12px;padding:0;max-width:680px;width:92vw;box-shadow:var(--shadow);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(6,20,26,.55)}
dialog .in{padding:16px}
dialog textarea{height:46vh;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
@media print{header{position:static}.acts,button{display:none}.item{break-inside:avoid}}
</style></head><body>

<header><div class="wrap">
  <h1>Pastry Pirates — playtest checklist</h1>
  <div class="sub">Build <strong id="stamp">2026-08-24f</strong> · <a href="https://playpastrypirates.com/4" target="_blank" rel="noopener">playpastrypirates.com/4</a>
   — if the menu shows an older stamp, stop and tell me: there's no build step, so an old stamp means it isn't deployed.</div>
  <div class="bar">
    <span class="count" id="count">0 / 0</span>
    <button class="primary" id="copy">Copy my notes</button>
    <button id="reset">Clear all</button>
    <span class="saved" id="saved">saves as you type</span>
  </div>
</div></header>

<section id="list"></section>

<dialog id="out"><div class="in">
  <p style="margin:0 0 8px"><strong>Paste this back to me.</strong> Only items you marked or commented on are included.</p>
  <textarea id="outtxt" readonly></textarea>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="primary" id="docopy">Copy to clipboard</button>
    <button id="close">Close</button>
  </div>
</div></dialog>

<script>
const DATA = [
 {h:"First — everything from your evening notes, fixed and measured"},
 {note:"<strong>All four of your reports shipped as build 2026-08-24f while you were away.</strong> Each item below says what I measured. Your #23 (the pulse) was rebuilt twice since the notes you pasted — it has its own section second."},
 {n:1,look:"Crew game: as the HOST, close the tab mid-voyage, take your time, then reopen the site",right:"The GUEST reads “⚓ Yer matey has left the game… let's give 'em 30 seconds to return before callin' off yer voyage.” — and when you get back inside the window, the voyage simply continues. Nobody is kicked.",why:"Your design, built verbatim. Measured in two windows: the message reaches the guest within 2 seconds; a host back at 8s resumed with the guest never seeing the death card."},
 {n:2,look:"Crew game: the host leaves for GOOD",right:"The guest keeps the message for the full 30 seconds, and only then gets the “left the voyage” card.",why:"Measured: the card landed at 32 seconds — your 30 plus one poll beat."},
 {n:3,look:"The recipe card: tap one to select it, hold the sea to peek the board, release — then tap the card ONCE",right:"That single tap confirms it. The selection you can see survives the peek, and the tap count honors it.",why:"Your #13. The internal selection was being silently reset by any outside tap while the visible selection stayed — pixels and state disagreed. Measured: select → tap the board → one tap commits."},
 {n:4,look:"Type your name and hit Enter — in the name popup, the join screen, or a pass-and-play name row",right:"Enter presses that screen's continue button. No mouse trip.",why:"Your #17 tweak, swept across every name field. The chat box keeps its own Enter."},
 {n:5,look:"A sail prompt — the whole stay-put flow, redesigned to your spec",right:"NO Stay put button anywhere at first. A yellow flashing square sits UNDER your own boat — you can see it peeking out around the hull. Tap your boat (or that square) and the normal Stay put circle appears; tap it and ye stay. “Aye, stay put” and “Keep sailin'” are gone entirely.",why:"Behind the boat came free — the sail-square layer already renders under the ships, your own 2026-08-02 layering. Measured end-to-end: square at exactly the boat's cell, button hidden until summoned, stay resolves."},

 {h:"Second — the pulse, rebuilt twice since the notes you pasted"},
 {note:"<strong>Your #23 paste was from build 24c; the design you ruled that afternoon shipped as 24d, and your Safari recording then exposed a real engine bug that shipped as 24e.</strong> The video's Pass circle measured 121px in all 16 frames — dead flat — because Safari resolves a CSS variable inside an animation ONCE, at start, and mine raced. The variable is gone; the swell is hard-coded and restarts cleanly in every browser."},
 {n:6,look:"SAFARI: any “what'll ye do” fan, several rounds in a row",right:"The circles visibly swell and settle — every prompt, every round, consistently. This is the one check only you can run; there is no Safari in my container.",why:"The intermittency you saw WAS the bug's fingerprint: Safari raced between the weak fallback and the real swell per prompt."},
 {n:7,look:"Everything on a STAGE — the flip coin, ceremony buttons, battle buttons, and the Start button in every mode",right:"All breathe the same orange glow — one ring, one definition. Start buttons pulse now (they never had any rule at all).",why:"Also: circles at the swell's peak keep clear water — the fan now reserves the room the pulse uses."},
 {n:8,look:"A greyed circle — an Attack ye can't afford",right:"Never pulses. A button that isn't asking for a tap stays still."},

 {h:"Third — carried over: still unchecked from your last round"},
 {note:"Renumbered from the old sheet; nothing here changed since, except where noted."},
 {n:9,look:"IF any reconnect ever sits there — about 15 seconds",right:"“⚓ Still reconnectin'…” with a Back to port button. You can never be stranded.",why:"Old #3."},
 {n:10,look:"Crew game: a GUEST reaches the ovens (host creates the room from /4/?ovens=1)",right:"They bake in their OWN browser — recipe, five face-down crates, shuffle, tapping, reveal.",why:"Old #5."},
 {n:11,look:"Crew game: while ANY captain bakes, the other screens",right:"Same face-down bench, same shuffle, same badges, same verdict, everywhere.",why:"Old #6."},
 {n:12,look:"Crew game: “Watch again 🌕1” as a guest",right:"Purse drops on your screen, shuffle replays, host ends on the same number.",why:"Old #7."},
 {n:13,look:"Crew game: close a tab mid-bake",right:"That captain forfeits in ~2½ seconds; the voyage carries on.",why:"Old #8."},
 {n:14,look:"Solo with ?ovens=1: the moment your bake is scored",right:"A few seconds to read it, then back to the board.",why:"Old #9."},
 {n:15,look:"Solo: the rest of that day, and attempt 2",right:"Nothing hides behind a spent card; a fresh Bake-Off card arrives for attempt 2.",why:"Old #10."},
 {n:16,look:"A storm that sweeps someone into the trade winds",right:"ONE report, in the post-storm summary. Never a separate line during the storm.",why:"Old #11."},
 {n:17,look:"The black market's first dry shelf — and every centre-stage card",right:"Clear of the header row, vertically comfortable.",why:"Old #12."},
 {n:18,look:"Pass, in every direction the fan points",right:"Side-to-side fan: Pass rightmost. Up-and-down: lowest. 45° cutoff.",why:"Old #14."},
 {n:19,look:"The greyed-Buy explainer — flip TAILS at a dock you can't afford",right:"“It costs 3🌕 and ye've 1🌕 — 2🌕 short.” Sits with its own circle, not across another box.",why:"Old #15."},
 {n:20,look:"Every coin flip — yours, a bot's, dock and battle",right:"All one second; bots' dock coins spin and land like yours.",why:"Old #16."},
 {n:21,look:"A narration bubble while sail squares are up",right:"Lands on open water — never on a square or the question.",why:"Old #22."},
 {n:22,look:"Solo, to the end card"},
 {n:23,look:"Pass-and-play, to the end card"},
 {n:24,look:"A crew game — two devices — to the end card, both screens",right:"Same game on both: same wording, same moment, cameras agreeing."},
 {n:25,look:"⚠️ Crew: does the GUEST draw the wind pill, clock chip and day counter?",right:"Still UNPROVEN. Missing any of the three is a real finding.",why:"Old #29 / PAR-02."},
 {n:26,look:"Crew: as a GUEST, counter-offer with coins",right:"A real slider, same as the host. No ± circles.",why:"Old #30."},
 {n:27,look:"How long a counter-offer takes",right:"One exchange, not a series.",why:"Old #31."},
 {n:28,look:"Counter-offer, then refresh mid-voyage",right:"Replays to the same place — your number remembered.",why:"Old #32."},
 {n:29,look:"❓ PASS-AND-PLAY: a second captain's trade-answer prompt with NO hand-off card",right:"YOUR TASTE CALL — recorded as correct, one line either way.",why:"Old #33."},

 {h:"Already known — please do NOT spend time reporting these"},
 {note:"<strong>1.</strong> Phone, trade with the coin slider: offer text hidden behind the slider box, “Toasty Wheat” clipped.<br><strong>2.</strong> Desktop recipe picker: “Bake this!” covering the plate icon on the selected card.<br><strong>3.</strong> Deny / Counter / Accept vs the italic helper — possibly cured with #19's class; if seen, mark #19.<br><strong>4.</strong> Occasional stacked circles in a crowded fan — known, intermittent, mine to catch.<br><strong>5.</strong> Extreme window shapes letterbox the board deliberately.<br><strong>Also deliberate:</strong> multi-captain trade holders are still asked one at a time — recorded open work, not a bug."}
];

const KEY="pp4-playtest-2026-08-24f";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));const s=document.getElementById("saved");s.textContent="saved ✓";clearTimeout(save._t);save._t=setTimeout(()=>s.textContent="saves as you type",1200);tally();};
const list=document.getElementById("list");

for(const d of DATA){
  if(d.h){const h=document.createElement("h2");h.textContent=d.h;list.appendChild(h);continue;}
  if(d.note){const p=document.createElement("div");p.className="note";p.innerHTML=d.note;list.appendChild(p);continue;}
  const it=document.createElement("div");it.className="item";it.id="i"+d.n;
  it.innerHTML=`<div class="top"><div class="n">${d.n}</div><div class="txt">
      <div class="look"></div>${d.right?'<div class="right"></div>':""}${d.why?'<div class="why"></div>':""}
    </div></div>
    <div class="acts">
      <button data-v="pass" aria-pressed="false">Passed</button>
      <button data-v="fail" aria-pressed="false">Problem</button>
    </div>
    <textarea placeholder="Notes on #${d.n}…"></textarea>`;
  it.querySelector(".look").textContent=d.look;
  if(d.right) it.querySelector(".right").textContent=d.right;
  if(d.why) it.querySelector(".why").textContent=d.why;
  const st=state[d.n]||{};
  const ta=it.querySelector("textarea");
  ta.value=st.c||""; if(ta.value) ta.classList.add("has");
  if(st.v) it.classList.add(st.v);
  it.querySelectorAll(".acts button").forEach(b=>{
    if(st.v===b.dataset.v) b.setAttribute("aria-pressed","true");
    b.onclick=()=>{
      const cur=state[d.n]||{}; const v=cur.v===b.dataset.v?null:b.dataset.v;
      state[d.n]={...cur,v};
      it.classList.remove("pass","fail"); if(v) it.classList.add(v);
      it.querySelectorAll(".acts button").forEach(o=>o.setAttribute("aria-pressed", String(o.dataset.v===v)));
      save();
    };
  });
  ta.oninput=()=>{state[d.n]={...(state[d.n]||{}),c:ta.value};ta.classList.toggle("has",!!ta.value);save();};
  it._d=d; list.appendChild(it);
}
function tally(){
  const items=DATA.filter(d=>d.n);
  const done=items.filter(d=>(state[d.n]||{}).v).length;
  const bad=items.filter(d=>(state[d.n]||{}).v==="fail").length;
  document.getElementById("count").textContent=`${done} / ${items.length} checked${bad?` · ${bad} problem${bad>1?"s":""}`:""}`;
}
tally();
document.getElementById("copy").onclick=()=>{
  const L=[`Pastry Pirates playtest — build ${document.getElementById("stamp").textContent}`,""];
  for(const d of DATA){ if(!d.n) continue; const s=state[d.n]||{}; if(!s.v && !(s.c||"").trim()) continue;
    L.push(`#${d.n} [${s.v==="pass"?"PASSED":s.v==="fail"?"PROBLEM":"—"}] ${d.look}`);
    if((s.c||"").trim()) L.push(`    ${s.c.trim().replace(/\n/g,"\n    ")}`);
  }
  const items=DATA.filter(d=>d.n), skipped=items.filter(d=>!(state[d.n]||{}).v).map(d=>d.n);
  if(skipped.length) L.push("", `Not checked: ${skipped.join(", ")}`);
  if(L.length<=2) L.push("(nothing marked yet)");
  document.getElementById("outtxt").value=L.join("\n");
  document.getElementById("out").showModal();
};
document.getElementById("docopy").onclick=async()=>{
  const t=document.getElementById("outtxt"); t.select();
  try{ await navigator.clipboard.writeText(t.value); document.getElementById("docopy").textContent="Copied ✓"; }
  catch(e){ document.execCommand("copy"); document.getElementById("docopy").textContent="Copied ✓"; }
  setTimeout(()=>document.getElementById("docopy").textContent="Copy to clipboard",1500);
};
document.getElementById("close").onclick=()=>document.getElementById("out").close();
document.getElementById("reset").onclick=()=>{ if(!confirm("Clear every mark and note?"))return;
  state={}; localStorage.removeItem(KEY); location.reload(); };
</script></body></html>
