<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pastry Pirates — playtest checklist</title>
<style>
:root{
  --ink:#12303a; --muted:#5b7580; --line:#d8e3e7; --card:#fffdf7; --bg:#eef4f6;
  --pass:#1f9d6b; --fail:#d1495b; --accent:#0f7f96; --shadow:0 1px 2px rgba(16,48,58,.08),0 6px 18px rgba(16,48,58,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#e8f1f4; --muted:#93aab3; --line:#22414c; --card:#12262e; --bg:#0b1a20;
  --pass:#3ec38c; --fail:#ff7085; --accent:#4fc3dd; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  padding:0 0 120px}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:14px 18px;box-shadow:var(--shadow)}
.wrap{max-width:920px;margin:0 auto}
h1{margin:0 0 2px;font-size:19px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13.5px}
.sub a{color:var(--accent)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.count{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px}
button{font:inherit;font-size:13.5px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
button:active{transform:translateY(1px)}
section{max-width:920px;margin:22px auto 0;padding:0 18px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
  margin:26px 0 10px;font-weight:700}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:14.5px;box-shadow:var(--shadow)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
  margin:0 0 12px;box-shadow:var(--shadow)}
.item.pass{border-left:4px solid var(--pass)}
.item.fail{border-left:4px solid var(--fail)}
.top{display:flex;gap:11px;align-items:flex-start}
.n{flex:0 0 auto;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:var(--bg);
  color:var(--muted);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.txt{flex:1 1 auto;min-width:0}
.look{font-weight:650}
.right{color:var(--muted);font-size:14.5px;margin-top:3px}
.why{color:var(--muted);font-size:13px;margin-top:5px;font-style:italic;opacity:.85}
.acts{display:flex;gap:7px;margin:11px 0 0;flex-wrap:wrap}
.acts button{min-width:74px}
.acts button[aria-pressed=true][data-v=pass]{background:var(--pass);color:#fff;border-color:transparent;font-weight:650}
.acts button[aria-pressed=true][data-v=fail]{background:var(--fail);color:#fff;border-color:transparent;font-weight:650}
textarea{width:100%;margin-top:9px;min-height:0;height:38px;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;height:84px}
textarea.has{height:84px;background:var(--card)}
.saved{color:var(--muted);font-size:12.5px}
dialog{border:none;border-radius:12px;padding:0;max-width:680px;width:92vw;box-shadow:var(--shadow);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(6,20,26,.55)}
dialog .in{padding:16px}
dialog textarea{height:46vh;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
@media print{header{position:static}.acts,button{display:none}.item{break-inside:avoid}}
</style></head><body>

<header><div class="wrap">
  <h1>Pastry Pirates — playtest checklist</h1>
  <div class="sub">Build <strong id="stamp">2026-08-24d</strong> · <a href="https://playpastrypirates.com/4" target="_blank" rel="noopener">playpastrypirates.com/4</a>
   — if the menu shows an older stamp, stop and tell me: there's no build step, so an old stamp means it isn't deployed.</div>
  <div class="bar">
    <span class="count" id="count">0 / 0</span>
    <button class="primary" id="copy">Copy my notes</button>
    <button id="reset">Clear all</button>
    <span class="saved" id="saved">saves as you type</span>
  </div>
</div></header>

<section id="list"></section>

<dialog id="out"><div class="in">
  <p style="margin:0 0 8px"><strong>Paste this back to me.</strong> Only items you marked or commented on are included.</p>
  <textarea id="outtxt" readonly></textarea>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="primary" id="docopy">Copy to clipboard</button>
    <button id="close">Close</button>
  </div>
</div></dialog>

<script>
const DATA = [
 {h:"First — the three that stopped your last playtest"},
 {note:"<strong>Everything from your evening list shipped today, in three builds — 2026-08-24a (the three blockers), b (the thirteen visible bugs), c (the menu and the pulse).</strong> All three are live; the stamp to look for is <strong>2026-08-24c</strong>. Every item below says what I measured, and where a call is yours, it says that instead."},
 {n:1,look:"Crew game: as the HOST, close the tab mid-voyage, then reopen the site",right:"You're back in your voyage within a few seconds. No endless “⚓ Reconnecting to yer voyage…”.",why:"The hang that ended your last playtest. Root cause: the “host left” alarm fired on EVERY host disconnect — your own reload included — and then the resume path refused to resume a “host left” room. You were locked out permanently. Reproduced in two windows, fixed on both sides."},
 {n:2,look:"Crew game: as a GUEST, when the host closes the tab for good",right:"After a few seconds you get the “host left the voyage” card. But if the host merely reloads and comes straight back, you are NOT kicked.",why:"The guest now waits 4 seconds and checks again before believing the host is gone."},
 {n:3,look:"IF any reconnect ever does sit there — about 15 seconds",right:"The card changes to “⚓ Still reconnectin'…” with a Back to port button that takes you home. You can never be stranded on that screen again.",why:"The escape hatch you asked for. I forced a stall to prove it fires, and proved it stands down when the resume is genuinely working."},
 {n:4,look:"Just play — solo AND crew. The blank “thinking” gaps between narrations and prompt buttons",right:"Prompts now type onto the screen while you watch, instead of a long blank and then popping in finished. It should feel alive, not laggy.",why:"The box was doing its whole entrance — fade, resize, typewriter — invisibly, then appearing done. Dead air in 3 minutes of play: 6.0s before, 1.5s after; longest single gap 2.9s → 0.7s. Your chosen pacing is untouched — it just happens on screen now."},

 {h:"Second — the crew bake-off, now triggerable"},
 {note:"<strong>How to trigger it (this is the answer to your “?ovens=1 doesn't seem to work”):</strong> the HOST creates the room from <a href='https://playpastrypirates.com/4/?ovens=1' target='_blank' rel='noopener'>playpastrypirates.com/4/?ovens=1</a> — guests join normally, no flag needed. Every human hold is stocked on Day 1 and the ovens light. It only works on a BRAND-NEW voyage — added to a game in progress it does nothing, and a refresh resumes rather than restarts. It now also survives the host reloading mid-game. Verified live in a real room: both screens, holds stocked, ovens lit, bench up. Items 5–8 are your untested 43–46 from last time."},
 {n:5,look:"Crew game: a GUEST reaches the ovens",right:"They bake in their OWN browser — their recipe, their five face-down crates, Ready to bake!, the shuffle, tapping in order, the reveal.",why:"Your old #43."},
 {n:6,look:"Crew game: while ANY captain bakes, look at the other screens",right:"Everyone watches the same face-down bench — the same shuffle, the same badges appearing as each crate is named, the same verdict.",why:"Your old #44."},
 {n:7,look:"Crew game: tap “Watch again 🌕1” as a guest",right:"Your purse drops immediately on your own screen, the prompt stays open, the shuffle replays — and the host ends on the same number.",why:"Your old #45."},
 {n:8,look:"Crew game: close a tab mid-bake",right:"The table does not hang. That captain forfeits in about 2½ seconds and the voyage carries on.",why:"Your old #46."},
 {n:9,look:"Solo with ?ovens=1: the moment your bake is scored",right:"You get a few seconds to read “N of 5 in place…”, then the card goes and you're back on the board.",why:"Your old #27 — now testable the same way, fresh solo voyage from the ?ovens=1 link."},
 {n:10,look:"Solo: the rest of that day, and the next attempt",right:"Nothing is behind a spent card. If you missed some, a fresh Bake-Off card arrives for attempt 2.",why:"Your old #28."},

 {h:"Third — your thirteen visible bugs, fixed"},
 {n:11,look:"A storm that sweeps someone into the trade winds",right:"ONE report, in the post-storm summary — “the trade winds sweep Flaky Jack along the rim” — never a separate line during the storm.",why:"Your #8."},
 {n:12,look:"The black market's first dry shelf — and every centre-stage card",right:"The card sits clear of the header row, vertically comfortable. Never nested behind “DAY N”.",why:"Your #9. The card's lift is now capped by the header band, so no centre-stage card can run under it."},
 {n:13,look:"The recipe card",right:"Two taps: one to select, one to choose.",why:"Your #12. Measured two taps end-to-end on this build. My best explanation for your third: the old invisible reveal was eating a tap that landed before the buttons went live — exactly what item 4's fix removed. If you still count three, tell me which tap dies."},
 {n:14,look:"Pass, in every direction the fan can point",right:"When the circles run side to side, Pass is the RIGHTMOST — you read it last. When they run up and down, it's the lowest. The switch is at your 45° cutoff.",why:"Your #16."},
 {n:15,look:"The italic “why is this greyed out” line — flip TAILS at a dock you can't afford",right:"It tells the truth — “It costs 3🌕 and ye've 1🌕 — 2🌕 short.” No invented price rise. And it sits with its own greyed circle, not across some other box.",why:"Your #17, both halves. The copy is fixed outright. The position I believe was the same stale-layout class as the lag — please look at where it lands."},
 {n:16,look:"Every coin flip — yours, a bot's, dock and battle",right:"All take the same one second. A bot docking flips a real spinning coin that lands, same as yours.",why:"Your #18, including your 1.0s correction. One clock in one place now; the bots' dock flips previously skipped the spin entirely."},
 {n:17,look:"Join a crew and type a bot's name in any capitalization — “flaky jack”",right:"You get the name. The bot quietly takes another. Nobody shares a name, whatever the capitalization.",why:"Your #30."},
 {n:18,look:"“Join a crew” from the home screen",right:"Straight to the join screen — code field and captain-name field, your last name already filled in. The “What do they call ye, captain?” modal between is gone.",why:"Your #31."},
 {n:19,look:"The board on a phone",right:"Square again, and the top row of islands is never cut off. The “CAPTAINS” heading line is gone from the captains box.",why:"Your problems 1 and 4, one fault: the captains card was taking the board's height. It now yields."},
 {n:20,look:"Anything on the stage — a coin flip, a ceremony",right:"The board behind it holds STILL. No director movement, no narration bubbles appearing behind the veil. The stage gets all your attention; when it clears, the game resumes.",why:"Your #7, your principle implemented at the one camera seam rather than patched per case."},
 {n:21,look:"“Stay put”, then its confirm",right:"The original Stay put circle disappears while “Aye, stay put / Keep sailin'” is up — no duplicate-button feeling. Cancel or confirm, and the world is back in order.",why:"Your problem 3."},
 {n:22,look:"A narration bubble while sail squares are up",right:"The bubble lands on open water — never on a square you have to tap, and not on the question either.",why:"Your #38. The director's room reservation now survives the whole turn instead of evaporating after the first camera fit."},

 {h:"Fourth — the two you ruled on today"},
 {n:23,look:"Everything that asks for a tap — your afternoon re-ruling, rebuilt in 24d",right:"Two cues, one rule, every mode the same. ON A STAGE (ceremonies, battle cards, the flip coin, and the Start buttons of every mode) the button breathes the coin's orange glow. OVER THE BOARD (the action circles, the stay-put confirm, floating card buttons) it visibly SWELLS — no ring. Greyed circles never pulse.",why:"Measured: the old fan pulse was running but invisible — a 6px swell with a faint ring that read over dock sand and vanished over the sea, which is why it seemed to pulse only at docks. The swell is now 10px on a 66px circle, and every assignment lives in one block of CSS."},
 {n:24,look:"The desktop menu",right:"Your pick — A1 with no background: a quiet left-aligned list at the bottom of the captains column, the sea showing through behind it, Leave the ship in red at the very bottom under a thin rule.",why:"Item 21. Shipped exactly the variant you chose."},
 {n:25,look:"The phone ☰ menu",right:"The same quiet rows in the slide-up sheet — one look for the same menu on both devices.",why:"Consistency rule: same list, two mounts, one stylesheet."},

 {h:"Fifth — the whole-voyage bar, and what's still unchecked from last time"},
 {note:"The bar is <strong>complete voyages to the end-of-voyage card</strong>, not stretches of play. Items 26–33 are your old 39–42 and 47–50 — none of them has ever been checked by you."},
 {n:26,look:"Solo, to the end card"},
 {n:27,look:"Pass-and-play, to the end card"},
 {n:28,look:"A crew game — two devices — to the end card, watching both screens",right:"Host and guest showing the same game: same wording for the same moment, neither stuck on a prompt the other finished, cameras agreeing."},
 {n:29,look:"⚠️ In the crew game: does the GUEST draw the wind pill, clock chip and day counter?",right:"Still UNPROVEN, not passing. If your guest screen is missing any of the three, that's a real finding."},
 {n:30,look:"Crew game: as a GUEST, counter-offer with a number of coins",right:"A real slider, same as the host. No ± circles.",why:"Your old #47."},
 {n:31,look:"How long a counter-offer takes",right:"One exchange, not a series of them.",why:"Your old #48."},
 {n:32,look:"Counter-offer, then refresh mid-voyage",right:"The voyage replays to the same place — your dragged number remembered, not reset to 1.",why:"Your old #49."},
 {n:33,look:"❓ PASS-AND-PLAY: a second captain's trade-answer prompt appears with NO hand-off card",right:"YOUR TASTE CALL, not a bug. Recorded as correct — cargo is public and answering costs no turn — but you may want the hand-off anyway. One line either way.",why:"Your old #50."},

 {h:"Already known — please do NOT spend time reporting these"},
 {note:"<strong>1.</strong> Phone, a trade with the coin slider: the offer text hidden behind the slider box, “Toasty Wheat” clipped by its rounded edge — still on the books, untouched today.<br><strong>2.</strong> Desktop recipe picker: “Bake this!” covering the plate icon on the selected card — still on the books.<br><strong>3.</strong> Deny / Counter / Accept circles overlapping the italic helper line — <em>possibly</em> cured by the same fix as item 15; if you still see it, mark item 15 instead of reporting it fresh.<br><strong>4.</strong> Occasional stacked circles in a crowded fan (“Attack −2 behind Pass +1”) — predates this round; the intermittent case is known and mine to catch.<br><strong>5.</strong> On extremely odd window shapes the board deliberately letterboxes — that's a choice, not a fault.<br><strong>Also known and deliberate:</strong> in a multi-captain trade, holders are still asked one at a time — the parallel round was stopped on purpose and is recorded as open work, not a bug."}
];

const KEY="pp4-playtest-2026-08-24c";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));const s=document.getElementById("saved");s.textContent="saved ✓";clearTimeout(save._t);save._t=setTimeout(()=>s.textContent="saves as you type",1200);tally();};
const list=document.getElementById("list");

for(const d of DATA){
  if(d.h){const h=document.createElement("h2");h.textContent=d.h;list.appendChild(h);continue;}
  if(d.note){const p=document.createElement("div");p.className="note";p.innerHTML=d.note;list.appendChild(p);continue;}
  const it=document.createElement("div");it.className="item";it.id="i"+d.n;
  it.innerHTML=`<div class="top"><div class="n">${d.n}</div><div class="txt">
      <div class="look"></div>${d.right?'<div class="right"></div>':""}${d.why?'<div class="why"></div>':""}
    </div></div>
    <div class="acts">
      <button data-v="pass" aria-pressed="false">Passed</button>
      <button data-v="fail" aria-pressed="false">Problem</button>
    </div>
    <textarea placeholder="Notes on #${d.n}…"></textarea>`;
  it.querySelector(".look").textContent=d.look;
  if(d.right) it.querySelector(".right").textContent=d.right;
  if(d.why) it.querySelector(".why").textContent=d.why;
  const st=state[d.n]||{};
  const ta=it.querySelector("textarea");
  ta.value=st.c||""; if(ta.value) ta.classList.add("has");
  if(st.v) it.classList.add(st.v);
  it.querySelectorAll(".acts button").forEach(b=>{
    if(st.v===b.dataset.v) b.setAttribute("aria-pressed","true");
    b.onclick=()=>{
      const cur=state[d.n]||{}; const v=cur.v===b.dataset.v?null:b.dataset.v;
      state[d.n]={...cur,v};
      it.classList.remove("pass","fail"); if(v) it.classList.add(v);
      it.querySelectorAll(".acts button").forEach(o=>o.setAttribute("aria-pressed", String(o.dataset.v===v)));
      save();
    };
  });
  ta.oninput=()=>{state[d.n]={...(state[d.n]||{}),c:ta.value};ta.classList.toggle("has",!!ta.value);save();};
  it._d=d; list.appendChild(it);
}
function tally(){
  const items=DATA.filter(d=>d.n);
  const done=items.filter(d=>(state[d.n]||{}).v).length;
  const bad=items.filter(d=>(state[d.n]||{}).v==="fail").length;
  document.getElementById("count").textContent=`${done} / ${items.length} checked${bad?` · ${bad} problem${bad>1?"s":""}`:""}`;
}
tally();
document.getElementById("copy").onclick=()=>{
  const L=[`Pastry Pirates playtest — build ${document.getElementById("stamp").textContent}`,""];
  for(const d of DATA){ if(!d.n) continue; const s=state[d.n]||{}; if(!s.v && !(s.c||"").trim()) continue;
    L.push(`#${d.n} [${s.v==="pass"?"PASSED":s.v==="fail"?"PROBLEM":"—"}] ${d.look}`);
    if((s.c||"").trim()) L.push(`    ${s.c.trim().replace(/\n/g,"\n    ")}`);
  }
  const items=DATA.filter(d=>d.n), skipped=items.filter(d=>!(state[d.n]||{}).v).map(d=>d.n);
  if(skipped.length) L.push("", `Not checked: ${skipped.join(", ")}`);
  if(L.length<=2) L.push("(nothing marked yet)");
  document.getElementById("outtxt").value=L.join("\n");
  document.getElementById("out").showModal();
};
document.getElementById("docopy").onclick=async()=>{
  const t=document.getElementById("outtxt"); t.select();
  try{ await navigator.clipboard.writeText(t.value); document.getElementById("docopy").textContent="Copied ✓"; }
  catch(e){ document.execCommand("copy"); document.getElementById("docopy").textContent="Copied ✓"; }
  setTimeout(()=>document.getElementById("docopy").textContent="Copy to clipboard",1500);
};
document.getElementById("close").onclick=()=>document.getElementById("out").close();
document.getElementById("reset").onclick=()=>{ if(!confirm("Clear every mark and note?"))return;
  state={}; localStorage.removeItem(KEY); location.reload(); };
</script></body></html>
