<title>Pastry Pirates — V1 · The Plank — Wind spinner</title>
<desc>80 mm dial (also engraved on the board's corner). Each quadrant's last 18° is a storm wedge — one fifth of the wheel, the app's 20%. Two arrows on one pivot: the bold one labelled NOW is this round's wind, the hollow one is the forecast. Stack: dial, hollow arrow, washer, NOW arrow, washer, M3 bolt + nut (or a brass paper fastener). Units: mm. 20 mm squares, 3 mm material. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
