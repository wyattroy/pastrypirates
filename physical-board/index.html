<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastry Pirates — the laser-cut set, three ways</title>
<style>
  :root { --wood:#e9d9b3; --ink:#1d1a14; --paper:#f7f1e3; --line:#c9b98f; --red:#d0342c; --pick:#2a7f62; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--paper); }
  header { padding:18px 28px 12px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  header h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:#5a5243; }
  .bar { display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .bar label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  nav { display:flex; gap:6px; flex-wrap:wrap; padding:12px 28px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:96px; z-index:4; }
  nav button { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:20px; cursor:pointer; font-size:14px; }
  nav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  nav button .n { opacity:.6; font-size:12px; margin-left:4px; }
  main { padding:20px 28px 80px; }
  .intro { max-width:900px; margin:0 0 18px; color:#5a5243; }
  .cols { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px; align-items:start; }
  @media (max-width:1000px) { .cols { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card.picked { border-color:var(--pick); box-shadow:0 0 0 2px var(--pick); }
  .card h2 { margin:0; padding:12px 14px 4px; font-size:17px; }
  .card .blurb { margin:0; padding:0 14px 10px; color:#5a5243; font-size:13.5px; }
  .art { background:var(--wood); padding:10px; cursor:zoom-in; min-height:120px; display:flex; align-items:center; justify-content:center; }
  .art svg { width:100%; height:auto; max-height:520px; display:block; }
  .layer-cut * { stroke-width:.6px; vector-effect:non-scaling-stroke; }
  body.hide-cut .layer-cut { display:none; }
  body.hide-raster .layer-raster { display:none; }
  .meta { padding:10px 14px; font-size:13px; color:#5a5243; border-top:1px solid var(--line); }
  .meta b { color:var(--ink); }
  .meta .notes { margin:6px 0 0; }
  .links { padding:0 14px 10px; font-size:13px; }
  .links a { margin-right:10px; }
  .fb { padding:10px 14px 14px; border-top:1px solid var(--line); }
  .fb label.pick { display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:8px; cursor:pointer; }
  .fb textarea { width:100%; min-height:74px; border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; font-size:14px; resize:vertical; }
  .general { margin-top:28px; max-width:900px; }
  .general textarea { width:100%; min-height:110px; border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  .actions { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .actions button { padding:10px 16px; border-radius:8px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; font-size:14px; }
  .actions button.alt { background:#fff; color:var(--ink); }
  .status { font-size:13px; color:#5a5243; align-self:center; }
  #overlay { position:fixed; inset:0; background:rgba(20,16,10,.92); display:none; z-index:20; overflow:auto; cursor:zoom-out; }
  #overlay.on { display:block; }
  #overlay .wrap { padding:30px; min-height:100%; display:flex; align-items:flex-start; justify-content:center; }
  #overlay svg { background:var(--wood); width:min(96vw, 1400px); height:auto; }
  #overlay .hint { position:fixed; top:12px; left:16px; color:#fff; font-size:13px; opacity:.8; }
  kbd { background:#eee; border:1px solid #ccc; border-radius:3px; padding:0 4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Pastry Pirates — the laser-cut set, three ways</h1>
  <p>Pick one version per piece and leave notes. Black = engraved (RASTER layer), red hairline = cut (CUT layer). Wood colour is only a preview.</p>
  <div class="bar">
    <label><input type="checkbox" id="tCut" checked> show cut lines</label>
    <label><input type="checkbox" id="tRaster" checked> show engraving</label>
    <span class="status" id="dims"></span>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <p class="intro" id="intro"></p>
  <div class="cols" id="cols"></div>
  <section class="general">
    <h2>Anything else</h2>
    <textarea id="general" placeholder="Sizes, material, what's missing, what you'd change across the board…"></textarea>
    <div class="actions">
      <button id="copy">Copy all feedback</button>
      <button id="download" class="alt">Download feedback.md</button>
      <span class="status" id="saved">Your picks and notes save in this browser as you type.</span>
    </div>
  </section>
</main>
<div id="overlay"><div class="hint">click anywhere to close</div><div class="wrap" id="overlayWrap"></div></div>
<script src="site-data.js"></script>
<script>
(function(){
  const D = window.PB_DATA, KEY = "pp-physical-board-feedback";
  const groups = D.versions[0].groups.map(g => ({ id:g.id, title:g.title }));
  let cur = (new URLSearchParams(location.search).get("g")) || groups[0].id; if (!groups.some(g => g.id === cur)) cur = groups[0].id;
  const fb = JSON.parse(localStorage.getItem(KEY) || "{}"); // {groupId:{pick, notes:{v1,v2,v3}}, general}
  const save = () => { localStorage.setItem(KEY, JSON.stringify(fb)); document.getElementById("saved").textContent = "Saved " + new Date().toLocaleTimeString(); };
  document.getElementById("dims").textContent = `${D.cell} mm squares · ${D.material} mm material · generated ${D.generated}`;

  const nav = document.getElementById("nav");
  for (const g of groups) { const b = document.createElement("button"); b.dataset.id = g.id; b.innerHTML = g.title; b.onclick = () => { cur = g.id; history.replaceState(null, "", "?g=" + g.id); render(); }; nav.appendChild(b); }

  function render(){
    for (const b of nav.children) b.classList.toggle("on", b.dataset.id === cur);
    const cols = document.getElementById("cols"); cols.innerHTML = "";
    const f = fb[cur] = fb[cur] || { pick:"", notes:{} };
    document.getElementById("intro").textContent = cur === "pieces-all" ? "Everything except the board nested on one sheet, per version — for cutting, not for judging." : "Same piece, three treatments. Click a picture to see it big.";
    for (const v of D.versions) {
      const g = v.groups.find(x => x.id === cur);
      const card = document.createElement("div"); card.className = "card" + (f.pick === v.id ? " picked" : "");
      card.innerHTML = `<h2>${v.name}</h2><p class="blurb">${cur === "board" ? v.blurb : ""}</p>
        <div class="art" title="click to enlarge">${g.svg}</div>
        <div class="meta"><b>${g.count}</b> piece${g.count === 1 ? "" : "s"} · sheet <b>${g.w} × ${g.h} mm</b><p class="notes">${g.notes}</p></div>
        <div class="links"><a href="${v.dir}/${g.id}.svg" target="_blank">SVG</a><a href="${v.dir}/${g.id}.dxf" download>DXF</a></div>
        <div class="fb"><label class="pick"><input type="radio" name="pick-${cur}" value="${v.id}" ${f.pick === v.id ? "checked" : ""}> this one</label>
        <textarea placeholder="Notes on ${v.name.replace(/^V\\d · /, "")}…">${f.notes[v.id] || ""}</textarea></div>`;
      card.querySelector(".art").onclick = () => { document.getElementById("overlayWrap").innerHTML = g.svg; document.getElementById("overlay").classList.add("on"); };
      card.querySelector("input[type=radio]").onchange = () => { f.pick = v.id; save(); render(); };
      card.querySelector("textarea").oninput = e => { f.notes[v.id] = e.target.value; save(); };
      cols.appendChild(card);
    }
  }
  document.getElementById("overlay").onclick = () => document.getElementById("overlay").classList.remove("on");
  document.getElementById("tCut").onchange = e => document.body.classList.toggle("hide-cut", !e.target.checked);
  document.getElementById("tRaster").onchange = e => document.body.classList.toggle("hide-raster", !e.target.checked);
  const gen = document.getElementById("general"); gen.value = fb.general || ""; gen.oninput = () => { fb.general = gen.value; save(); };

  function markdown(){
    const lines = [`# Physical board feedback — ${new Date().toISOString().slice(0,10)}`, ""];
    for (const g of groups) { const f = fb[g.id]; if (!f) continue; const notes = Object.entries(f.notes || {}).filter(([,t]) => t.trim());
      if (!f.pick && !notes.length) continue;
      lines.push(`## ${g.title}`, `- pick: ${f.pick ? D.versions.find(v => v.id === f.pick).name : "(none yet)"}`);
      for (const [v, t] of notes) lines.push(`- ${v}: ${t.trim().replace(/\\n/g, " / ")}`);
      lines.push("");
    }
    if ((fb.general || "").trim()) lines.push("## Anything else", fb.general.trim(), "");
    return lines.join("\\n");
  }
  document.getElementById("copy").onclick = async () => { try { await navigator.clipboard.writeText(markdown()); document.getElementById("saved").textContent = "Copied — paste it to Claude."; } catch { prompt("Copy this:", markdown()); } };
  document.getElementById("download").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([markdown()], { type:"text/markdown" })); a.download = "physical-board-feedback.md"; a.click(); };
  render();
})();
</script>
</body>
</html>
