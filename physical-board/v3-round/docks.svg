<title>Pastry Pirates — V3 · The Round Table — Docks (7)</title>
<desc>The cut-out T (Wyatt, 2026-08-25): the pier itself is the piece — 9 mm stem whose deck becomes the unchanged 9 × 2.5 mm tab (0.05 play), 12.5 mm total reach so the head's outer face sits on the square's midline, 18 × 3.5 mm head with 1 mm rounds and a straight berth face the 24 × 12 hull lies broadside against. Planks run onto the tab; the head's planks turn 90°. The four bollards are half-round lugs CUT into the stem's sides — his pen drawing. Units: mm. 25 mm squares, 5.9 mm material. KERF-COMPENSATED: cut lines offset 0.1375 mm away from the kept wood (kerf 0.275 mm) — cut exactly on the line. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
