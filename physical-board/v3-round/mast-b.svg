<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="64.472mm" height="40.474mm" viewBox="0 0 64.472 40.474">
<title>Pastry Pirates — V3 · The Round Table — Mast option B — a spar between the mastheads</title>
<desc>Option A, plus his spar. The mast now stands 7 mm proud of the sail, which is what lets the notch sit ON the centreline instead of dodging to one side. The fore sail is 2 mm shorter, so its masthead is 2 mm taller (head 9 against 7) and BOTH notch floors land at the same height above the deck — a straight spar seats on both. A third part per ship. Units: mm. 23.35 mm squares, 5.9 mm material. KERF-COMPENSATED: cut lines offset 0.1375 mm away from the kept wood (kerf 0.275 mm) — cut exactly on the line. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
