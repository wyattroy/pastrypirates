<title>Pastry Pirates — V3 · The Round Table — Ships (4)</title>
<desc>Four captains told apart in wood: CRUMBLE plain, BISCOTTI striped, GINGERSNAP dotted, SHORTBREAD checked (pink, teal, green, orange in the app — paint the sails if you like). An old pirate ship after the game's own sailboat art: a 6 mm hull seen from above (24 × 12 mm, deck planks, a tiller) with two slots ACROSS the beam; two plain 3 mm square sails on short masts whose tabs drop through the slots and sit flush underneath. About 24 mm tall. Paint the sails for the captain. Units: mm. 25 mm squares, 6 mm material. No kerf compensation in this file — it is a design view; cut from the sheet-N files. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
