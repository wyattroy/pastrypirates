<title>Pastry Pirates — V3 · The Round Table — Ships (4)</title>
<desc>Four captains told apart in wood: CRUMBLE plain, BISCOTTI striped, GINGERSNAP dotted, SHORTBREAD checked (pink, teal, green, orange in the app — paint the sails if you like). Three pieces each: a 6 mm hull seen from above (22 × 11 mm, deck planks, a tiller) with two slots on its centreline; a 3 mm mainsail and a 3 mm jib, each with a tab that drops through a slot and sits flush underneath. About 30 mm tall on the water. Units: mm. 25 mm squares, 6 mm material. No kerf compensation in this file — it is a design view; cut from the sheet-N files. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
