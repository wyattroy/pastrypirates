<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="281.2mm" height="116.4mm" viewBox="0 0 281.2 116.4">
<title>Pastry Pirates — V3 · The Round Table — Wind spinner</title>
<desc>Nested, all 3 mm: a 96 mm backing disc; the game's compass as a 70 mm dial glued on it (storm wedge in the last fifth of each quadrant); a ring that turns around the dial with a fleur-de-lis pointer for THIS round's wind; a fleur-de-lis needle on the centre pivot for the forecast. Stack: backing, dial + ring (same level), needle, washer — an M3 × 16 bolt with a nyloc nut. Two arrows on one pivot: the bold one labelled NOW is this round's wind, the hollow one is the forecast. Stack: dial, hollow arrow, washer, NOW arrow, washer — 30 mm of wood, so an M3 × 38 bolt and nyloc nut. Units: mm. 25 mm squares, 6 mm material. No kerf compensation in this file — it is a design view; cut from the sheet-N files. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
