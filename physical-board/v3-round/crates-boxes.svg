<title>Pastry Pirates — V3 · The Round Table — Cargo crates (4)</title>
<desc>One open crate per captain, 66.24 × 46.56 × 10 mm in 3 mm ply — remade 2026-08-30: wide and shallow so six ingredient tokens lie FLAT in a 3 × 2 grid, face up, readable by everyone at the table. One cut gap per side, solid corner posts, box joints. Cargo is public, as in the game. Paint to mark whose it is. Units: mm. 23.35 mm squares, 5.9 mm material. KERF-COMPENSATED: cut lines offset 0.1375 mm away from the kept wood (kerf 0.275 mm) — cut exactly on the line. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
