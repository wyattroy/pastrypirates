<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="267.272mm" height="176.352mm" viewBox="0 0 267.272 176.352">
<title>Pastry Pirates — V3 · The Round Table — Cargo crates (4)</title>
<desc>One crate per PLAYER — it holds every ingredient that captain accumulates during the game, in the open; it is not an endgame device. 55.032 × 39.088 × 10 mm in 3 mm ply — remade 2026-08-30: wide and shallow so six ingredient tokens lie FLAT in a 3 × 2 grid, face up, readable by everyone at the table. One cut gap per side, solid corner posts, box joints. Cargo is public, as in the game. Paint to mark whose it is. Units: mm. 23.35 mm squares, 5.9 mm material. KERF-COMPENSATED: cut lines offset 0.1375 mm away from the kept wood (kerf 0.275 mm) — cut exactly on the line. RASTER = black fill (engrave), CUT = red hairline (cut). Generated by physical-board/generate.mjs.</desc>
